<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Recreio Arcade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand">Recreio<br>Arcade</a>
    <h2>Entrar</h2>
    <p class="auth-sub">Acesse sua conta para explorar o catálogo</p>

    <div class="auth-error-banner" id="error-banner">E-mail ou senha inválidos.</div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">E-mail<span class="required">*</span></label>
        <input type="email" id="email" placeholder="seu@email.com" required>
        <span class="form-error">Informe um e-mail válido.</span>
      </div>

      <div class="field">
        <label for="senha">Senha<span class="required">*</span></label>
        <input type="password" id="senha" placeholder="••••••••" required minlength="4">
        <span class="form-error">A senha precisa ter pelo menos 6 caracteres.</span>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <p class="auth-switch">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
