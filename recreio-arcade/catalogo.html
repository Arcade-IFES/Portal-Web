<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Recreio Arcade</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .games-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 900px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .games-grid { grid-template-columns: 1fr; } }

  .game-card {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .game-card:hover { transform: translateY(-3px); box-shadow: 0 14px 26px rgba(0,0,0,0.45); }
  .game-card__cover { aspect-ratio: 16/9; width: 100%; object-fit: cover; }
  .game-card__body { padding: 14px 16px 16px; }
  .game-card__title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin: 0 0 6px; }
  .game-card__meta { font-size: 0.82rem; color: var(--text-secondary); margin: 0 0 6px; }
  .game-card__resumo { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; margin: 0 0 10px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .game-card__footer { display: flex; align-items: center; justify-content: space-between; }
  .game-card__nota { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
  .game-card__nota span { color: var(--green-300); }
  .game-card__avals { font-size: 0.72rem; color: var(--text-muted); display: block; margin-top: 2px; }
  .game-card__download {
    background: none; border: none; color: var(--text-primary);
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm); transition: background .15s ease, color .15s ease;
  }
  .game-card__download:hover { background: rgba(62,207,94,0.15); color: var(--green-300); }
  .game-card__download svg { width: 20px; height: 20px; }
</style>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main>
  <section class="panel">
    <div id="games-grid" class="games-grid"></div>
  </section>
</main>

<footer class="app-footer" id="app-footer"></footer>

<!-- Aviso: Download Feito -->
<div class="modal-overlay" id="modal-download">
  <div class="modal-box" style="text-align:center;">
    <p style="font-family:var(--font-display); font-weight:700; font-size:1.3rem; margin: 6px 0 22px;">
      Download<br>Feito
    </p>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn btn-primary" onclick="closeModal('modal-download')">Voltar</button>
    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
