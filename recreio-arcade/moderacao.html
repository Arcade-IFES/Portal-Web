<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fila de Moderação — Recreio Arcade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main>
  <section class="panel">
    <div class="mod-layout">
      <div>
        <div class="mod-game-info">
          <div class="mod-game-info__cover"><img id="mod-cover" src="" alt=""></div>
          <p class="mod-game-info__title" id="mod-titulo"></p>
          <p class="mod-game-info__meta">por <strong id="mod-autores"></strong></p>
          <p class="mod-game-info__meta">Enviado em: <span id="mod-enviado"></span></p>
          <p class="mod-game-info__meta" style="margin-top:10px;"><strong style="color: var(--green-300);">Descrição:</strong></p>
          <p class="mod-game-info__desc" id="mod-descricao"></p>
        </div>

        <div class="mod-preview">
          <p class="section-title" style="font-size:0.95rem;" id="preview-title-icon">Preview do Jogo</p>
          <div class="mod-preview__frame"><img id="mod-preview-img" src="" alt="Prévia do jogo"></div>
          <div style="text-align:right; margin-top:10px;">
            <button class="btn btn-ghost btn-sm" id="btn-tela-cheia">Abrir em Tela Cheia</button>
          </div>
        </div>
      </div>

      <div class="mod-actions">
        <p class="section-title" id="acoes-title-icon">Ações de Moderação</p>

        <div class="field" style="margin-bottom:10px;">
          <label>Decisão<span class="required">*</span></label>
          <div class="decision-group">
            <button type="button" class="decision-btn approve" id="btn-aprovar"></button>
            <button type="button" class="decision-btn reject" id="btn-reprovar"></button>
          </div>
        </div>

        <div class="reject-fields" id="reject-fields">
          <div class="field">
            <label>Motivo da Reprovação (selecione pelo menos uma)<span class="required">*</span></label>
            <div id="motivos-selects"></div>
          </div>

          <div class="field">
            <label for="mod-obs">O que fazer para passar (obrigatória se reprovar):<span class="required">*</span></label>
            <textarea id="mod-obs" maxlength="500" placeholder="Explique o que o autor deve corrigir..."></textarea>
            <span class="char-count"><span id="mod-obs-count">0</span>/500</span>
          </div>
        </div>

        <div class="mod-footer-actions">
          <button class="btn btn-primary" id="btn-confirmar" disabled>Registrar Decisão</button>
        </div>
      </div>
    </div>

    <div class="pagination" id="pagination"></div>
  </section>
</main>

<footer class="app-footer" id="app-footer"></footer>

<!-- Confirmação de decisão registrada -->
<div class="modal-overlay" id="modal-confirmacao">
  <div class="modal-box" style="text-align:center;">
    <p id="confirmacao-icone" style="margin-bottom:10px;"></p>
    <p style="font-family:var(--font-display); font-weight:700; font-size:1.1rem;" id="confirmacao-texto"></p>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn btn-primary" onclick="proximoJogo()">Continuar</button>
    </div>
  </div>
</div>

<!-- Lightbox: preview do jogo em tela cheia -->
<div class="modal-overlay" id="modal-lightbox">
  <div class="modal-box modal-lightbox">
    <button class="modal-close" id="lightbox-close" onclick="closeModal('modal-lightbox')" aria-label="Fechar"></button>
    <img id="lightbox-img" src="" alt="Prévia do jogo em tela cheia">
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/moderacao.js"></script>
</body>
</html>
