<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de Jogadores — Recreio Arcade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header" id="app-header"></header>

<main>
  <section class="panel">
    <div class="rank-toolbar">
      <div>
        <span class="tab-group__label">Tipo de Ranking</span>
        <div class="tab-group">
          <button class="tab-btn is-active" id="tab-geral" data-icon="globe">Geral</button>
          <button class="tab-btn" id="tab-por-jogo" data-icon="gamepad">Por Jogo</button>
        </div>
      </div>
      <div class="filter-group" id="filter-jogo-wrap" style="display:none;">
        <label for="filter-jogo">Filtrar por Jogo</label>
        <select id="filter-jogo"></select>
      </div>
    </div>

    <div class="ranking-card">
      <table class="ranking-table">
        <thead>
          <tr>
            <th>Posição</th>
            <th>Apelido</th>
            <th class="is-numeric">Pontos</th>
          </tr>
        </thead>
        <tbody id="ranking-jogadores-body"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </section>
</main>

<footer class="app-footer" id="app-footer"></footer>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/ranking-jogadores.js"></script>
</body>
</html>
